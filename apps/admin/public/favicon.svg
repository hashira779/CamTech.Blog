<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1815" />
      <stop offset="50%" stop-color="#241e19" />
      <stop offset="100%" stop-color="#151210" />
    </linearGradient>

    <!-- Metallic Terracotta Copper Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a431e" />
      <stop offset="40%" stop-color="#c96637" />
      <stop offset="70%" stop-color="#e2885a" />
      <stop offset="100%" stop-color="#f5b28d" />
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5be" />
      <stop offset="100%" stop-color="#d47040" />
    </linearGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#c96637" stroke-width="5" stroke-opacity="0.35" />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="240" r="140" fill="#c96637" opacity="0.08" filter="url(#softGlow)" />

  <!-- Central Angkor Wat Temple & Digital Circuit Iconography -->
  <g id="temple-circuit" stroke="url(#copperGrad)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- === Central Spire (Tallest) === -->
    <!-- Pinnacle Cone -->
    <polygon points="256,90 236,132 276,132" fill="url(#copperGrad)" stroke="none" />
    <!-- Spire Tiers -->
    <polygon points="256,128 226,170 286,170" fill="none" stroke-width="6" />
    <polygon points="256,166 218,212 294,212" fill="none" stroke-width="6" />
    <polygon points="256,206 208,258 304,258" fill="none" stroke-width="6.5" />
    
    <!-- === Left Spire === -->
    <polygon points="172,160 156,195 188,195" fill="url(#copperGrad)" stroke="none" />
    <polygon points="172,192 148,228 196,228" fill="none" stroke-width="5" />
    <polygon points="172,224 140,264 204,264" fill="none" stroke-width="5.5" />

    <!-- === Right Spire === -->
    <polygon points="340,160 324,195 356,195" fill="url(#copperGrad)" stroke="none" />
    <polygon points="340,192 316,228 364,228" fill="none" stroke-width="5" />
    <polygon points="340,224 308,264 372,264" fill="none" stroke-width="5.5" />

    <!-- === Circuit Board Traces Interlocking with Temple Base === -->
    <!-- Center Bus Lines -->
    <path d="M 256,268 L 256,330 L 220,366 L 160,366" fill="none" stroke-width="5" />
    <path d="M 256,330 L 292,366 L 352,366" fill="none" stroke-width="5" />
    
    <!-- Left Flank Traces -->
    <path d="M 172,272 L 172,320 L 132,360 L 100,360" fill="none" stroke-width="5" />
    <path d="M 148,320 L 148,340 L 112,376 L 90,376" fill="none" stroke-width="4" />

    <!-- Right Flank Traces -->
    <path d="M 340,272 L 340,320 L 380,360 L 412,360" fill="none" stroke-width="5" />
    <path d="M 364,320 L 364,340 L 400,376 L 422,376" fill="none" stroke-width="4" />

    <!-- Vertical Data Pathways -->
    <path d="M 236,264 L 236,310 L 194,352" fill="none" stroke-width="4.5" />
    <path d="M 276,264 L 276,310 L 318,352" fill="none" stroke-width="4.5" />
  </g>

  <!-- Glowing Circuit Terminals / Nodes -->
  <g fill="url(#goldHighlight)">
    <circle cx="256" cy="270" r="5.5" />
    <circle cx="160" cy="366" r="6" />
    <circle cx="352" cy="366" r="6" />
    <circle cx="100" cy="360" r="5" />
    <circle cx="90" cy="376" r="4.5" />
    <circle cx="412" cy="360" r="5" />
    <circle cx="422" cy="376" r="4.5" />
    <circle cx="194" cy="352" r="5" />
    <circle cx="318" cy="352" r="5" />
  </g>

  <!-- Wordmark "CAMTECH" -->
  <text x="256" y="430" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="7" 
        fill="url(#goldHighlight)">CAMTECH</text>

  <!-- Subtitle Tagline "BLOG" -->
  <text x="256" y="456" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#a79e92" 
        opacity="0.85">TECHNOLOGY &amp; JOURNALISM</text>
</svg>
