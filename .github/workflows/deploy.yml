name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy
    runs-on: self-hosted

    steps:
      - name: Deploy on Server
        run: |
          cd /home/ubuntu-server/CamTech.Blog
          
          # Save previous commit hash for auto-rollback
          PREV_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit: $PREV_COMMIT"
          
          git reset --hard HEAD
          git fetch origin main
          git reset --hard origin/main
          
          echo "Building images (site remains up)..."
          if ! docker compose build; then
            echo "❌ Build failed! Aborting deployment."
            git reset --hard $PREV_COMMIT
            exit 1
          fi
          
          echo "Starting deployment (minimal downtime)..."
          if ! docker compose up -d --remove-orphans; then
            echo "❌ Deployment failed! Initiating auto-rollback to $PREV_COMMIT..."
            git reset --hard $PREV_COMMIT
            docker compose up -d --remove-orphans
            echo "✅ Auto-rollback completed. Marking action as failed."
            exit 1
          fi

          echo "Waiting 5 seconds for services to settle..."
          sleep 5
          docker compose ps

      - name: Verify API Health & Seed Database
        run: |
          cd /home/ubuntu-server/CamTech.Blog
          echo "=== Container Status ==="
          docker compose ps
          
          echo "=== Testing API Health ==="
          for i in {1..6}; do
            if docker compose exec -T api curl -s -f http://localhost:8000/health > /dev/null; then
              echo "✅ API container is healthy and responding!"
              break
            fi
            echo "Waiting for API to become ready (attempt $i/6)..."
            sleep 5
          done

          echo "=== Seeding Database ==="
          docker compose exec -T api python seed_data.py || echo "Seed notice: completed or not applicable"
          docker compose exec -T api python fix_guides_and_restore_transport.py || echo "Fix script notice: completed or not applicable"
