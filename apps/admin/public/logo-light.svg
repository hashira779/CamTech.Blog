<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Crisp Porcelain -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f4eee7" />
    </linearGradient>

    <!-- Rich Terracotta Copper Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Warm Amber Core Accent -->
    <linearGradient id="coreLightAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgLight)" stroke="#ea580c" stroke-width="4.5" stroke-opacity="0.3" filter="url(#softShadow)" />

  <!-- Monogram C Arc -->
  <path d="M 352,166 A 136,136 0 1,0 352,346" fill="none" stroke="url(#copperGrad)" stroke-width="40" stroke-linecap="round" />

  <!-- Central T Pillar & Crossbar -->
  <path d="M 205,212 L 325,212" fill="none" stroke="url(#copperGrad)" stroke-width="38" stroke-linecap="round" />
  <path d="M 265,212 L 265,346" fill="none" stroke="url(#copperGrad)" stroke-width="38" stroke-linecap="round" />

  <!-- Apex Pinnacle Diamond -->
  <polygon points="265,110 288,145 265,180 242,145" fill="url(#coreLightAmber)" />
</svg>
