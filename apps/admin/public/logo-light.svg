<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Crisp Porcelain Ivory -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f3ede6" />
    </linearGradient>

    <!-- Rich Terracotta Copper Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Crisp Squircle Rim -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2dad1" />
      <stop offset="100%" stop-color="#d4c8bc" />
    </linearGradient>

    <!-- Warm Ambient Glow (Pure Vector Radial Gradient) -->
    <radialGradient id="coreGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgLight)" stroke="url(#rimLight)" stroke-width="3.5" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlowLight)" />

  <!-- Monogram C Arc -->
  <path d="M 343,152 A 136,136 0 1,0 343,360" fill="none" stroke="url(#copperGrad)" stroke-width="42" stroke-linecap="round" />

  <!-- Central T Pillar & Crossbar -->
  <path d="M 200,206 L 312,206" fill="none" stroke="url(#copperGrad)" stroke-width="40" stroke-linecap="round" />
  <path d="M 256,206 L 256,324" fill="none" stroke="url(#copperGrad)" stroke-width="40" stroke-linecap="round" />
</svg>