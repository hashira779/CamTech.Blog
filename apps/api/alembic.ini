# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = %(here)s/migrations

# Template used to generate migration file names; The default value is %(rev)s_%(slug)s
file_template = %%(rev)s_%%(slug)s

# Sys.path setting; defaults to the current working directory.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file as well as the filename.
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a dynamic .py extension to be used as revision files
# sourceless = false

# Version location specification; This defaults to %(here)s/migrations/versions.
version_locations = %(here)s/migrations/versions

# Version path separator
# version_path_separator = os

# Set to 'true' to search source files recursively in each "version_locations" directory
# recursive_version_locations = false

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# Database URL is dynamically loaded by env.py from app.common.config (settings.DATABASE_URL)
# or the DATABASE_URL environment variable.
sqlalchemy.url = 

[post_write_hooks]
# post_write_hooks defines scripts or Python methods that are run on newly
# generated revision scripts.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
