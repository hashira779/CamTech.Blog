<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkUniv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <linearGradient id="amberGradUniv" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="coreLightUniv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <filter id="glowUniv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgDarkUniv)" stroke="#f97316" stroke-width="4.5" stroke-opacity="0.35" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="256" r="140" fill="#f97316" opacity="0.08" filter="url(#glowUniv)" />

  <!-- Monogram C Arc -->
  <path d="M 352,166 A 136,136 0 1,0 352,346" fill="none" stroke="url(#amberGradUniv)" stroke-width="40" stroke-linecap="round" />

  <!-- Central T Pillar & Crossbar -->
  <path d="M 205,212 L 325,212" fill="none" stroke="url(#amberGradUniv)" stroke-width="38" stroke-linecap="round" />
  <path d="M 265,212 L 265,346" fill="none" stroke="url(#amberGradUniv)" stroke-width="38" stroke-linecap="round" />

  <!-- Apex Pinnacle Diamond -->
  <polygon points="265,110 288,145 265,180 242,145" fill="url(#coreLightUniv)" filter="url(#glowUniv)" />
</svg>
