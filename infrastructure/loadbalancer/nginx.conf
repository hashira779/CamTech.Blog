# ==============================================================================
# Daily Discovery Platform - High-Availability Load Balancer Configuration
# Architecture: Cloudflare Edge -> NGINX LB -> Next.js Pool (3x) + FastAPI Pool (3x)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Performance Tuning & Zero-Copy Buffering
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # 2. Logging with Request Correlation IDs
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"request_id":"$http_x_request_id",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # 3. Compression (Gzip & Brotli)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 4. Multi-Tier Rate Limiting Zones (Section 26)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # 5. Microcaching for High Traffic Spikes (Breaking News Protection)
    proxy_cache_path /var/cache/nginx/microcache
        levels=1:2
        keys_zone=MICROCACHE:20m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # 6. Upstream Pools (Section 4 & 8)
    # Next.js Web Frontend Cluster
    upstream web_cluster {
        least_conn;
        server web-01:3000 max_fails=3 fail_timeout=10s weight=100;
        server web-02:3000 max_fails=3 fail_timeout=10s weight=100;
        server web-03:3000 max_fails=3 fail_timeout=10s weight=100;
        keepalive 64;
    }

    # FastAPI API Backend Cluster
    upstream api_cluster {
        least_conn;
        server api-01:8000 max_fails=3 fail_timeout=10s weight=100;
        server api-02:8000 max_fails=3 fail_timeout=10s weight=100;
        server api-03:8000 max_fails=3 fail_timeout=10s weight=100;
        keepalive 64;
    }

    # 7. Virtual Host Server
    server {
        listen 80;
        listen [::]:80;
        server_name dailydiscovery.com www.dailydiscovery.com;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dailydiscovery.com www.dailydiscovery.com;

        # SSL Configuration
        ssl_certificate /etc/ssl/certs/dailydiscovery.crt;
        ssl_certificate_key /etc/ssl/private/dailydiscovery.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers (Section 36)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Request Correlation Header
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        # -------------------------------------------------------------
        # Health Check Endpoints (Section 5)
        # -------------------------------------------------------------
        location /health {
            proxy_pass http://api_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            access_log off;
        }

        location /ready {
            proxy_pass http://api_cluster/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            access_log off;
        }

        location /live {
            proxy_pass http://api_cluster/live;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            access_log off;
        }

        # -------------------------------------------------------------
        # API Gateway Route
        # -------------------------------------------------------------
        location /api/ {
            limit_conn addr_conn_limit 20;
            limit_req zone=api_general burst=30 nodelay;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }

        # Specific Strict Rate Limits on Auth Login
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
        }

        # Specific Rate Limits on Search
        location /api/v1/search {
            limit_req zone=search_limit burst=10 nodelay;
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
        }

        # -------------------------------------------------------------
        # Web Application & Static Assets (Next.js)
        # -------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://web_cluster;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            # Stale-while-revalidate microcaching for public pages during breaking news
            proxy_cache MICROCACHE;
            proxy_cache_valid 200 302 10s;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://web_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }
    }
}
