name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy
    runs-on: self-hosted

    steps:
      - name: Deploy on Server
        run: |
          cd /home/ubuntu-server/CamTech.Blog
          
          # Save previous commit hash for auto-rollback
          PREV_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit: $PREV_COMMIT"
          
          git reset --hard HEAD
          git fetch origin main
          git reset --hard origin/main
          
          echo "Building images (site remains up)..."
          if ! docker compose build; then
            echo "❌ Build failed! Aborting deployment."
            git reset --hard $PREV_COMMIT
            exit 1
          fi
          
          echo "Starting deployment (minimal downtime)..."
          if ! docker compose up -d --remove-orphans; then
            echo "❌ Deployment failed! Initiating auto-rollback to $PREV_COMMIT..."
            git reset --hard $PREV_COMMIT
            docker compose up -d --remove-orphans
            echo "✅ Auto-rollback completed. Marking action as failed."
            exit 1
          fi
      - name: Seed Database
        run: |
          cd /home/ubuntu-server/CamTech.Blog
          # We check if the api container is running and seed data
          docker compose exec -T api python seed_data.py || echo "Seed failed or not applicable"
