# ==============================================================================
# Docker Compose Development Override Configuration
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Credentials come from the same `${VAR}` substitution as production so that the two files
# cannot drift into asking Postgres for one password and the API for another. Put them in the
# `.env` next to docker-compose.yml (see docs/deployment.md); nothing here needs a real value.
# ==============================================================================
services:
  web:
    command: npm run dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - INTERNAL_API_URL=http://api:8000/api/v1
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
      - "9229:9229"

  admin:
    command: npx vite --host 0.0.0.0 --port 3001
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    ports:
      - "3001:3001"
      - "9230:9229"

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      # The base file pins APP_ENV=production so a deploy cannot inherit `development` from the
      # repo's .env; a dev box asks for the other answer explicitly.
      - APP_ENV=development
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - RELOAD=true
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is missing from the server .env next to docker-compose.yml}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is missing from the server .env next to docker-compose.yml}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-discovery_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from the server .env}@postgres:5432/${POSTGRES_DB:-daily_discovery}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is missing from the server .env}@redis:6379/0
      - STORAGE_PROVIDER=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is missing from the server .env}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is missing from the server .env}
      - S3_BUCKET=${S3_BUCKET:-dailydiscovery-media}
      - S3_PUBLIC_URL=http://localhost:9000/${S3_BUCKET:-dailydiscovery-media}
    volumes:
      - ./apps/api:/app
      - ./database:/app/database
    ports:
      - "8000:8000"
      - "5678:5678"

  worker:
    environment:
      - APP_ENV=development
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is missing from the server .env next to docker-compose.yml}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is missing from the server .env next to docker-compose.yml}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-discovery_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from the server .env}@postgres:5432/${POSTGRES_DB:-daily_discovery}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is missing from the server .env}@redis:6379/0
      - STORAGE_PROVIDER=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is missing from the server .env}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is missing from the server .env}
      - S3_BUCKET=${S3_BUCKET:-dailydiscovery-media}
      - S3_PUBLIC_URL=http://localhost:9000/${S3_BUCKET:-dailydiscovery-media}
    volumes:
      - ./apps/api:/app
