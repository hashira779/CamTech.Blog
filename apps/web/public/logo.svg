<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Obsidian -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="60%" stop-color="#0b0b0e" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Vibrant Copper-Amber Tech Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Subtle Premium Squircle Rim -->
    <linearGradient id="rimDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1" />
    </linearGradient>

    <!-- Clean Vector Ambient Core Glow (NO FILTERS / NO CLIPPING BOXES) -->
    <radialGradient id="coreGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgDark)" stroke="url(#rimDark)" stroke-width="3.5" />

  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlowDark)" />

  <!-- Monogram C Arc (World-Class Clean Pure Vector Geometry) -->
  <path d="M 343,152 A 136,136 0 1,0 343,360" fill="none" stroke="url(#amberGrad)" stroke-width="42" stroke-linecap="round" />

  <!-- Central T Pillar & Crossbar (Balanced, Symmetrical, Zero Collisions) -->
  <path d="M 200,206 L 312,206" fill="none" stroke="url(#amberGrad)" stroke-width="40" stroke-linecap="round" />
  <path d="M 256,206 L 256,324" fill="none" stroke="url(#amberGrad)" stroke-width="40" stroke-linecap="round" />
</svg>